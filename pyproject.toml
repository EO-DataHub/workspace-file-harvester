[project]
name = "workspace-file-harvester"
version = "0.1.0"
description = "Harvest workspace files"
readme = "README.md"

requires-python = ">=3.14,<3.15"

license = {file = "LICENSE"}

authors = [
  {name = "Telespazio UK Ltd", email = "hannah.collingwood@telespazio.com" }
]

maintainers = [
  {name = "Telespazio UK Ltd", email = "hannah.collingwood@telespazio.com" }
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
    "boto3",
    "botocore",
    "eodhp-utils",
    "pystac-client",
    "pystac",
    "fastapi[standard]",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-processor-baggage",
    "opentelemetry-instrumentation-logging",
    "elasticsearch<9.0.0",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-mock",
    "pytest-watcher",
    "pytest-xdist",
    "ruff",
    "validate-pyproject",
    "moto",
    "requests-mock",
    "munch",
]

[project.urls]
homepage = "https://github.com/EO-DataHub/"
repository = "https://github.com/EO-DataHub/workspace-file-harvester"
changelog = "https://github.com/EO-DataHub/workspace-file-harvester/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workspace_file_harvester"]

[tool.uv]
package = true
exclude-newer = "1w"

[tool.uv.sources]
eodhp-utils = { git = "https://github.com/EO-DataHub/eodhp-utils", tag = "v0.1.7" }

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers = [
  "integrationtest: Integration test"
]

[tool.ruff]
line-length = 119

[tool.ruff.lint]
select = [
    "E",    # Pycodestyle errors
    "W",    # Pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "FAST", # FastAPI
    "RUF",  # RUF-specific rules
    "SIM",  # Simplifications
    "B",    # Bugbear
    "ANN",  # Annotations
    "PLC",  # Pylint convention
    "PLE",  # Pylint errors
    "UP",   # pyupgrade
    "FURB", # refurb
    "PT",   # pytest
]
ignore = [
    "E501",   # line too long
    "SIM108", # ternary operator
    "SIM103", # return bool directly
    "B008"    # function call in default argument (incompatible with FastAPI)
]
